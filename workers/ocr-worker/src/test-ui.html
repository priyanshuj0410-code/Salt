<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salt OCR · extraction tester</title>
<style>
  :root {
    --bg:#fff; --surface:#fafafa; --surface-2:#f4f4f5; --border:#e4e4e7; --border-strong:#d4d4d8;
    --text:#18181b; --text-2:#52525b; --text-3:#676770;
    --primary:#18181b; --primary-hover:#27272a; --primary-text:#fff;
    --success:#166534; --success-bg:#f0fdf4; --success-border:#bbf7d0;
    --warning:#b45309; --warning-bg:#fffbeb; --warning-border:#fde68a;
    --danger:#b91c1c; --danger-bg:#fef2f2; --danger-border:#fecaca;
    --info:#1e40af; --info-bg:#eff6ff; --info-border:#bfdbfe;
    --radius:0.5rem;
    --sans:"Geist Variable","Inter",system-ui,-apple-system,sans-serif;
    --mono:"Geist Mono Variable",ui-monospace,"SF Mono",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 80px; }
  header { display:flex; align-items:baseline; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .wordmark { font-weight:600; font-size:20px; letter-spacing:-0.01em; }
  .sub { color:var(--text-3); font-size:13px; }
  .chip { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 10px; }
  .uppercase { text-transform:uppercase; letter-spacing:0.04em; font-size:11px; font-weight:600; color:var(--text-3); }

  .drop { border:1.5px dashed var(--border-strong); border-radius:var(--radius); background:var(--surface); padding:36px 20px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color:var(--primary); background:var(--surface-2); }
  .drop h2 { margin:0 0 4px; font-size:15px; font-weight:600; }
  .drop p { margin:0; color:var(--text-3); font-size:13px; }
  .opts { display:flex; align-items:center; gap:16px; margin-top:14px; flex-wrap:wrap; font-size:13px; color:var(--text-2); }
  .opts label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .muted { color:var(--text-3); }

  .btn { font:inherit; font-weight:500; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); border-radius:var(--radius); padding:7px 14px; cursor:pointer; }
  .btn:hover { background:var(--surface-2); }
  .btn.primary { background:var(--primary); color:var(--primary-text); border-color:var(--primary); }
  .btn.primary:hover { background:var(--primary-hover); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .sel { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border-strong); border-radius:6px; padding:4px 8px; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }
  .card { border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); overflow:hidden; }
  .card-h { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface); }
  .card-h .name { font-weight:600; font-size:13px; }
  .card-b { padding:14px; }
  .badge { font-family:var(--mono); font-size:11px; border-radius:999px; padding:2px 8px; border:1px solid; }
  .b-info { color:var(--info); background:var(--info-bg); border-color:var(--info-border); }
  .b-ok { color:var(--success); background:var(--success-bg); border-color:var(--success-border); }
  .b-warn { color:var(--warning); background:var(--warning-bg); border-color:var(--warning-border); }
  .b-err { color:var(--danger); background:var(--danger-bg); border-color:var(--danger-border); }
  .b-neutral { color:var(--text-2); background:var(--surface-2); border-color:var(--border); }

  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0 0 12px; font-size:13px; }
  .kv dt { color:var(--text-3); }
  .kv dd { margin:0; font-family:var(--mono); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-3); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); }
  td { padding:6px 8px; border-bottom:1px solid var(--surface-2); }
  td.num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .scroll { max-height:360px; overflow:auto; }

  details { margin-top:12px; }
  summary { cursor:pointer; color:var(--text-2); font-size:12px; }
  pre { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px; overflow:auto; font-family:var(--mono); font-size:11.5px; max-height:300px; }

  .preview img { max-width:100%; border:1px solid var(--border); border-radius:6px; margin-bottom:8px; display:block; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border-strong); border-top-color:var(--text); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none; }
  .err { color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:var(--radius); padding:10px 12px; font-size:13px; }
  .section-title { margin:26px 0 10px; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="wordmark">Salt</span>
    <span class="sub">OCR extraction tester</span>
    <span class="chip" id="modelChip">model: …</span>
  </header>

  <div class="drop" id="drop">
    <h2>Drop an invoice — or click to choose</h2>
    <p>PDF · image (JPG/PNG) · CSV — runs the real worker pipeline (poppler → Gemma vision)</p>
    <input type="file" id="file" class="hidden" accept="application/pdf,image/*,.csv,text/csv" />
  </div>
  <div class="opts">
    <label>Model: <select id="modelSel" class="sel"></select></label>
    <label><input type="checkbox" id="flashChk" /> <span>also run Gemini Flash (paid)</span></label>
    <span class="muted" id="flashNote"></span>
  </div>

  <div id="status" class="hidden" style="margin-top:18px;"></div>
  <div id="results"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const drop = $("#drop"), fileInput = $("#file"), statusEl = $("#status"), resultsEl = $("#results");
const flashChk = $("#flashChk"), flashNote = $("#flashNote"), modelSel = $("#modelSel");
let hasFlash = false;

function updateChip() { $("#modelChip").textContent = "model: " + (modelSel.value || "?"); }
modelSel.addEventListener("change", updateChip);

fetch("/config").then(r => r.json()).then(c => {
  hasFlash = !!c.flash;
  flashChk.disabled = !hasFlash;
  flashNote.textContent = hasFlash ? "" : "(set GEMINI_API_KEY in .env to enable)";
});

fetch("/models").then(r => r.json()).then(m => {
  const list = m.models || [];
  modelSel.innerHTML = list.map(x =>
    '<option value="' + escapeHtml(x.name) + '"' + (x.name === m.default ? ' selected' : '') + '>'
    + escapeHtml(x.name) + (x.vision ? ' · vision' : '') + '</option>'
  ).join("") || '<option>' + escapeHtml(m.default || "(no models)") + '</option>';
  updateChip();
}).catch(() => { updateChip(); });

drop.addEventListener("click", () => fileInput.click());
["dragover","dragenter"].forEach(e => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, () => drop.classList.remove("over")));
drop.addEventListener("drop", (ev) => { ev.preventDefault(); if (ev.dataTransfer.files[0]) handle(ev.dataTransfer.files[0]); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) handle(fileInput.files[0]); });

function readBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(new Error("could not read file"));
    r.readAsDataURL(file);
  });
}

async function handle(file) {
  resultsEl.innerHTML = "";
  statusEl.className = "";
  statusEl.innerHTML = '<span class="spinner"></span> Extracting <b>' + escapeHtml(file.name) + '</b> … (a cold model load can take a minute)';
  try {
    const base64 = await readBase64(file);
    const mime = file.type || (file.name.toLowerCase().endsWith(".csv") ? "text/csv" : "application/octet-stream");
    const res = await fetch("/extract", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ filename: file.name, mime, base64, runFlash: flashChk.checked && hasFlash, model: modelSel.value || undefined }),
    });
    const out = await res.json();
    if (!res.ok || out.error) throw new Error(out.error || ("HTTP " + res.status));
    statusEl.className = "hidden";
    render(file, out);
  } catch (e) {
    statusEl.className = "";
    statusEl.innerHTML = '<div class="err">' + escapeHtml(e.message) + '</div>';
  }
}

function render(file, out) {
  const parts = [];
  // Preview
  parts.push('<div class="section-title">Source</div>');
  parts.push('<div class="card"><div class="card-b preview">');
  if (out.images && out.images.length) {
    parts.push('<div class="muted" style="margin-bottom:8px">' + out.images.length + ' page image(s) rasterized + sent to the vision model</div>');
    out.images.forEach(b => parts.push('<img src="data:image/png;base64,' + b + '" />'));
  } else if (out.text != null) {
    parts.push('<div class="muted" style="margin-bottom:8px">text layer sent to the model (no rasterize, no OCR)</div>');
    parts.push('<pre>' + escapeHtml(out.text) + '</pre>');
  } else {
    parts.push('<div class="muted">' + escapeHtml(file.name) + '</div>');
  }
  parts.push('</div></div>');

  // Engines
  parts.push('<div class="section-title">Extraction</div>');
  parts.push('<div class="grid2">');
  parts.push(engineCard("Gemma (local · free)", out.model, out.gemma));
  if (out.flash) parts.push(engineCard("Gemini Flash (paid)", "gemini-flash-latest", out.flash));
  parts.push('</div>');

  resultsEl.innerHTML = parts.join("");
}

function engineCard(title, model, r) {
  if (!r) return "";
  let badge, body = "";
  if (r.error) {
    badge = '<span class="badge b-err">error</span>';
    body = '<div class="err">' + escapeHtml(r.error) + '</div>';
  } else {
    const j = r.json || {};
    const lines = Array.isArray(j.lines) ? j.lines : [];
    badge = '<span class="badge b-info">' + (r.ms != null ? (r.ms/1000).toFixed(1) + "s" : "") + '</span>'
          + ' <span class="badge b-neutral">' + lines.length + ' lines</span>'
          + (r.mode ? ' <span class="badge b-neutral">' + escapeHtml(r.mode) + '</span>' : '');
    body = headerKv(j) + lineTable(lines) + rawJson(j);
  }
  return '<div class="card"><div class="card-h"><span class="name">' + escapeHtml(title) + '</span>'
       + '<span class="chip">' + escapeHtml(model || "") + '</span>'
       + '<span style="margin-left:auto">' + badge + '</span></div>'
       + '<div class="card-b">' + body + '</div></div>';
}

function headerKv(j) {
  const row = (k, v) => '<dt>' + k + '</dt><dd>' + (v ? escapeHtml(String(v)) : '<span class="muted">—</span>') + '</dd>';
  return '<dl class="kv">'
    + row("Invoice no", j.invoice_no) + row("Date", j.date)
    + row("Vendor", j.vendor) + row("GSTIN", j.vendor_gstin)
    + '</dl>';
}

function lineTable(lines) {
  if (!lines.length) return '<div class="muted">No line items extracted.</div>';
  const num = (v) => '<td class="num">' + (v === 0 || v ? escapeHtml(String(v)) : "") + '</td>';
  const rows = lines.map(l =>
    '<tr><td>' + escapeHtml(String(l.item_name || "")) + '</td>'
    + '<td>' + escapeHtml(String(l.batch_no || "")) + '</td>'
    + '<td>' + escapeHtml(String(l.expiry || "")) + '</td>'
    + num(l.qty) + num(l.free_qty) + num(l.mrp) + num(l.ptr) + num(l.pts) + num(l.gst_rate) + '</tr>'
  ).join("");
  return '<div class="scroll"><table><thead><tr>'
    + '<th>Item</th><th>Batch</th><th>Exp</th><th style="text-align:right">Qty</th><th style="text-align:right">Free</th>'
    + '<th style="text-align:right">MRP</th><th style="text-align:right">PTR</th><th style="text-align:right">PTS</th><th style="text-align:right">GST%</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function rawJson(j) {
  return '<details><summary>Raw JSON</summary><pre>' + escapeHtml(JSON.stringify(j, null, 2)) + '</pre></details>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
